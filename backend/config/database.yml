default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  username: <%= ENV.fetch("DB_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "postgres") %>

development:
  <<: *default
  database: ee_backend_development

test:
  <<: *default
  database: ee_backend_test

production:
  <<: *default
  database: ee_backend_production
  url: <%= ENV["DATABASE_URL"] %>
